<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Health Report - Digital Twin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B0F19] text-slate-100 font-sans p-8 min-h-screen">
  <div class="max-w-4xl mx-auto bg-[#111625] border border-slate-700 rounded-2xl p-8 shadow-2xl print:bg-white print:text-black print:p-0 print:border-none">
    
    <!-- Report Header -->
    <div class="flex justify-between items-start border-b border-slate-800 pb-4 mb-6 print:border-black">
      <div>
        <h2 class="text-2xl font-bold text-white print:text-black">Digital Twin PMOS Clinical Health Report</h2>
        <p class="text-xs text-slate-400 print:text-gray-600">Generated for Physician & Endocrine Consultation</p>
      </div>
      <div class="text-right text-xs">
        <p class="font-bold text-indigo-400 print:text-indigo-800" id="rptPatientName">Patient: --</p>
        <p class="text-slate-400 print:text-gray-600" id="rptDateRange">Timeframe: Last 30 Days</p>
      </div>
    </div>

    <!-- Vitals Summary -->
    <div class="grid grid-cols-4 gap-4 bg-[#0B0F19] p-4 rounded-xl border border-slate-800 mb-6 print:bg-gray-100 print:border-gray-300">
      <div>
        <p class="text-[10px] text-slate-400 print:text-gray-600">Assigned Phenotype</p>
        <p class="text-xs font-bold text-purple-300 print:text-purple-900" id="rptPhenotype">--</p>
      </div>
      <div>
        <p class="text-[10px] text-slate-400 print:text-gray-600">BMI / Category</p>
        <p class="text-xs font-bold text-cyan-300 print:text-cyan-900" id="rptBmi">--</p>
      </div>
      <div>
        <p class="text-[10px] text-slate-400 print:text-gray-600">Avg Daily Calories</p>
        <p class="text-xs font-bold text-emerald-300 print:text-emerald-900" id="rptAvgCal">--</p>
      </div>
      <div>
        <p class="text-[10px] text-slate-400 print:text-gray-600">Workouts Logged</p>
        <p class="text-xs font-bold text-amber-300 print:text-amber-900" id="rptWorkouts">--</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex justify-between items-center pt-6 border-t border-slate-800 print:hidden">
      <a href="dashboard.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-xl">← Back to Dashboard</a>
      <button onclick="window.print()" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow-md">🖨️ Print / Save as PDF</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const uid = localStorage.getItem("user_id");
      if (!uid) return;
      try {
        const res = await fetch(`http://127.0.0.1:8000/api/generate-health-report/${uid}`);
        if (res.ok) {
          const data = await res.json();
          document.getElementById("rptPatientName").innerText = `Patient: ${data.report_metadata.patient_name}`;
          document.getElementById("rptPhenotype").innerText = data.report_metadata.assigned_phenotype;
          document.getElementById("rptBmi").innerText = `${data.report_metadata.bmi || '--'} (${data.report_metadata.bmi_category})`;
          document.getElementById("rptAvgCal").innerText = `${data.pillar_analytics.diet.avg_daily_calories} kcal`;
          document.getElementById("rptWorkouts").innerText = `${data.pillar_analytics.exercise.total_completed_workouts} sessions`;
        }
      } catch (e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
