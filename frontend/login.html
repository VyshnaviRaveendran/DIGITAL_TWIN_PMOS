<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Twin Health - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B0F19] text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white font-sans relative overflow-hidden">

  <!-- Ambient Glow Background -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[300px] bg-indigo-600/15 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="w-full max-w-md bg-[#111625] border border-slate-800 rounded-2xl p-8 shadow-2xl relative z-10">
    
    <!-- Brand Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center font-extrabold text-white text-xl mx-auto mb-4 shadow-lg shadow-indigo-500/20">
        DT
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">Welcome Back</h1>
      <p class="text-slate-400 text-xs mt-1">Sign in to sync your biological twin telemetry</p>
    </div>

    <!-- Alert Message Banner -->
    <div id="alertMessage" class="hidden mb-6 p-3 rounded-xl text-xs text-center font-medium"></div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4 text-xs">
      <div>
        <label for="email" class="block font-semibold text-slate-300 mb-1.5">Email Address</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="name@example.com"
          class="w-full px-4 py-3 bg-[#0B0F19] border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        >
      </div>

      <div>
        <label for="password" class="block font-semibold text-slate-300 mb-1.5">Password</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••"
          class="w-full px-4 py-3 bg-[#0B0F19] border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
        >
      </div>

      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 font-semibold text-white text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition duration-200 mt-2"
      >
        Sign In to Digital Twin
      </button>
    </form>

    <!-- Footer link -->
    <div class="mt-6 text-center text-xs text-slate-400">
      Don't have an account? 
      <a href="signup.html" class="text-indigo-400 hover:text-indigo-300 font-medium">Create one here</a>
    </div>

  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const alertMessage = document.getElementById('alertMessage');
    const submitBtn = document.getElementById('submitBtn');

    function showAlert(message, isError = true) {
      alertMessage.textContent = message;
      alertMessage.classList.remove('hidden', 'bg-rose-500/10', 'text-rose-400', 'border-rose-500/30', 'bg-emerald-500/10', 'text-emerald-400', 'border-emerald-500/30');
      
      if (isError) {
        alertMessage.classList.add('bg-rose-500/10', 'text-rose-400', 'border', 'border-rose-500/30');
      } else {
        alertMessage.classList.add('bg-emerald-500/10', 'text-emerald-400', 'border', 'border-emerald-500/30');
      }
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://127.0.0.1:8000/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Login successful! Redirecting to dashboard...', false);

          localStorage.setItem('user_token', data.access_token || 'sample_token_xyz');
          localStorage.setItem('user_id', data.user_id);
          localStorage.setItem('user_email', email);
          if (data.full_name) {
            localStorage.setItem('full_name', data.full_name);
          }

          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 800);

        } else {
          if (Array.isArray(data.detail)) {
            showAlert(data.detail[0].msg);
          } else {
            showAlert(data.detail || 'Login failed. Please check your credentials.');
          }
        }
      } catch (error) {
        console.error('Login Fetch Error:', error);
        showAlert('Unable to reach backend server. Make sure Uvicorn is active on port 8000.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Digital Twin';
      }
    });
  </script>

</body>
</html>
